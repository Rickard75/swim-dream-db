[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swim-dream-db"
version = "0.1.0"
description = "PostgreSQL database project for swimming training and education"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Riccardo Carroccio" }
]
dependencies = [
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
  "ipykernel>=6.29",
  "pytest>=8.0",
  "ruff>=0.6",
]
data = [
  "numpy>=1.26",
  "pandas>=2.2",
]

[tool.setuptools]
py-modules = []